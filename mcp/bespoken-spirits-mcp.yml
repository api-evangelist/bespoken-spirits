notes: >-
  Two live, anonymous MCP endpoints are served from the bespokenspirits.com origin.
  Both answer initialize and tools/list without credentials. Everything beyond
  tools/list on the UCP endpoint (tools/call, prompts/list, resources/list) fails
  with JSON-RPC -32001 "UCP discovery failed" until the caller supplies a UCP agent
  profile URI, so the tool schemas below are the real published contract but calling
  them requires an agent profile the caller hosts.
  DIVERGENCE WORTH NOTING: the /.well-known/ucp document advertises the MCP endpoint
  as https://kentucky-bourbontrail.myshopify.com/api/ucp/mcp (the underlying Shopify
  myshopify.com host), while llms.txt, agents.md and robots.txt all tell agents to use
  https://bespokenspirits.com/api/ucp/mcp. Both were probed; the branded host answers.
