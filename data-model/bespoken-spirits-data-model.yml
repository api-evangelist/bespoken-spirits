  - line_items[]
  - buyer
  - context
  - payment.instruments[]
  - fulfillment.methods[]
  - discounts.codes[]
  - attribution
- name: LineItem
  description: A quantity of an item within a Cart or Checkout.
  fields:
  - id
  - quantity
  - item
- name: Buyer
  description: Contact identity attached to a Cart or Checkout.
  fields:
  - email
  - phone_number
- name: PaymentInstrument
  description: A payment method presented at checkout. Required fields id, handler_id
    and type; type is card for cards and token for wallet payments.
  fields:
  - id
  - handler_id
  - type
  - billing_address
- name: BillingAddress
  fields:
