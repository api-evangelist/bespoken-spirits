  - handle
  surfaced_by:
  - search_catalog
  - lookup_catalog
  - get_product
  - GET /products.json
  - GET /products/{handle}.json
- name: Variant
  description: A purchasable variant of a product; resolvable by identifier through
    lookup_catalog and get_product.
  surfaced_by:
  - lookup_catalog
  - get_product
- name: Collection
  description: A merchandising grouping of products.
  surfaced_by:
  - GET /collections/{handle}/products.json
- name: Cart
  description: A mutable basket of line items with buyer, context, fulfillment,
    discount and attribution blocks.
  identified_by:
