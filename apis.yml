apis:
- name: Bespoken Spirits UCP Commerce MCP
  description: 'The Universal Commerce Protocol (UCP) shopping service for the Bespoken
    Spirits storefront, exposed over MCP as a JSON-RPC 2.0 endpoint. An anonymous
    tools/list returns 13 tools covering catalog search and lookup, cart lifecycle,
    checkout lifecycle and order retrieval. Every tools/call requires a UCP agent
    profile URI in meta.ucp-agent.profile, and complete_checkout additionally requires
    a meta.idempotency-key. Payment always requires contemporaneous buyer approval.'
  humanURL: https://bespokenspirits.com/agents.md
  baseURL: https://bespokenspirits.com/api/ucp/mcp
  tags:
  - Agentic Commerce
  - MCP
  - Universal Commerce Protocol
  - Checkout
  - Catalog
  properties:
  - type: MCPServer
    url: mcp/bespoken-spirits-mcp.yml
  - type: Documentation
    url: https://bespokenspirits.com/agents.md
- name: Bespoken Spirits Storefront MCP
  description: 'The Shopify storefront-renderer MCP endpoint for bespokenspirits.com.
    An anonymous tools/list returns 5 tools — search_catalog, get_cart, update_cart,
    search_shop_policies_and_faqs and get_product_details — a narrower, read-and-cart
    surface than the UCP endpoint, with no checkout or order tools.'
  humanURL: https://bespokenspirits.com/agents.md
  baseURL: https://bespokenspirits.com/api/mcp
  tags:
  - Agentic Commerce
  - MCP
  - Catalog
  - Shopify
  properties:
  - type: MCPServer
    url: mcp/bespoken-spirits-mcp.yml
- name: Bespoken Spirits Storefront Catalog JSON
  description: 'The public, unauthenticated Shopify storefront product JSON surface
    documented in the store''s own llms.txt and agents.md: /products.json for the
    catalog (30 by default, 47 with ?limit=250 at probe time), /products/{handle}.json for a single
    product, and /collections/{handle}/products.json for a collection. Read-only,
    no key required.'
  humanURL: https://bespokenspirits.com/llms.txt
  baseURL: https://bespokenspirits.com/products.json
  tags:
  - Catalog
  - Ecommerce
  - Products
  properties:
  - type: Documentation
    url: https://bespokenspirits.com/llms.txt
