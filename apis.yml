aid: bespoken-spirits
name: Bespoken Spirits
description: 'Bespoken Spirits is a Lexington, Kentucky beverage-alcohol technology
  company that uses a patented, data-driven precision maturation process — micro staves
  plus machine learning over tasting-panel data — to finish whiskey, bourbon and other
  spirits in days rather than years, and to produce custom private-label and one-of-one
  barrel expressions for brands, distillers and retailers. Its public technical surface
  is not a developer program but an agentic-commerce one: the bespokenspirits.com storefront
  runs on Shopify and publishes an llms.txt, an agents.md, a Universal Commerce Protocol
  (UCP) discovery document at /.well-known/ucp, and two anonymous, live MCP endpoints
  that expose catalog search, cart, checkout and order tools to AI shopping agents.'
